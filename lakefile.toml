name = "delegate"
# clang at -O3 fuses sinf/cosf pairs into __sincosf_stret, which is not bit-identical to the
# separate libm calls the interpreter makes; keep the compiled routes on sinf/cosf.
moreLeancArgs = ["-fno-builtin-sinf", "-fno-builtin-cosf"]
defaultTargets = ["Contracts", "FloatModel", "Flight", "flight", "AP_Math", "AC_PID", "AC_AttitudeControl", "AC_WPNav", "AP_Motors", "Copter", "copter"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "FloatModel"
globs = ["FloatModel.+"]

[[lean_lib]]
name = "Flight"
globs = ["Flight.+"]

[[lean_lib]]
name = "Contracts"
roots = ["Contracts"]

[[lean_exe]]
name = "flight"
root = "Flight.Main"

[[lean_lib]]
name = "AP_Math"
roots = ["AP_Math"]
globs = ["AP_Math", "AP_Math.+"]

[[lean_lib]]
name = "AC_PID"
roots = ["AC_PID"]
globs = ["AC_PID", "AC_PID.+"]

[[lean_lib]]
name = "AC_AttitudeControl"
roots = ["AC_AttitudeControl"]
globs = ["AC_AttitudeControl", "AC_AttitudeControl.+"]

[[lean_lib]]
name = "AC_WPNav"
roots = ["AC_WPNav"]
globs = ["AC_WPNav", "AC_WPNav.+"]

[[lean_lib]]
name = "AP_Motors"
roots = ["AP_Motors"]
globs = ["AP_Motors", "AP_Motors.+"]

[[lean_lib]]
name = "Copter"
roots = ["Copter"]
globs = ["Copter", "Copter.+"]

[[lean_exe]]
name = "copter"
root = "Copter.Main"
